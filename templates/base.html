<!DOCTYPE html>
<html  lang = "pt-br">
    <head> 
        <meta cherset = "UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title> 
            {% block title %}  Análise de dados do DATASUS - Febre Amarela {% endblock %}
        </title>

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    </head>

    <header class="topbar topbar-index">

        <button class="hamburger" id="menuToggle" aria-controls="sidebar" aria-expanded="false" aria-label="Abrir menu">
            <span></span><span></span><span></span>
        </button>

        <a class="marca" href="{{ url_for('home') }}">
            <span class="marca-title">Análise de dados<br>do DATASUS</span>
            <span class="marca-divider" aria-hidden="true"></span>
            <span class="marca-subtitle">{{ dados.subtitulo }}</span>
        </a>
        
        <a class="btn btn--cta" href="{{ url_for('destaque') }}"> Acesse algo
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <path d="M12 4v12m0 0l-4-4m4 4l4-4M5 20h14"/>
            </svg>
        </a>
    </header>

    <body>
        <div class = "menu" id = "menu"> </div>

        <nav class = "sidebar"  id = "sidebar" aria-hidden = "true">
            <ul class = "sidebar-list">
                <li> <a href = {{ url_for('opcao', num = 1) }}> Estudo Teórico </a> </li>
                <li> <a href = {{ url_for('opcao', num = 2) }}> Opção 02 </a> </li>
                <li> <a href = {{ url_for('opcao', num = 3) }}> Opção 03 </a> </li>
            </ul>
            <a class = "sidebar-destaque" href = "{{ url_for (('destaque'))}}"> Destaque
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <path d="M7 17L17 7M17 7H9M17 7V15"/>
                </svg>
            </a>
        </nav>

        <main> 
            {% block content %} {% endblock %}
        </main>

        <script src="{{ url_for('static', filename='main.js') }}"></script>
        {% block scripts %} {% endblock %}
    </body>
</html>
