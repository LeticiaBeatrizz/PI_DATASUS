<!DOCTYPE html>
<html  lang = "pt-br">
    <head> 
        <meta cherset = "UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title> 
            {% block title %}  Análise de dados do DATASUS - Febre Amarela {% endblock %}
        </title>

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    </head>
    <body>
        <div class = "menu" id = "menu"> </div>

        <nav class = "sidebar"  id = "sidebar" aria-hidden = "true">
            <ul class = "sidebar-list">
                <li> <a href = {{ url_for('opcao', num = 1) }}> Opção 01 </a> </li>
                <li> <a href = {{ url_for('opcao', num = 2) }}> Opção 02 </a> </li>
                <li> <a href = {{ url_for('opcao', num = 3) }}> Opção 03 </a> </li>
            </ul>
            <a class = "sidebar-destaque" href = "{{ url_for (('destaque'))}}"> Destaque
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <path d="M7 17L17 7M17 7H9M17 7V15"/>
                </svg>
            </a>
        </nav>

        {% block header %} {% endblock %}

        <main> 
            {% block content %} {% endblock %}
        </main>

        <script src="{{ url_for('static', filename='js/main.js') }}"></script>
        {% block scripts %} {% endblock %}
    </body>
</html>
