{% extends "base.html" %}

{% block title %}

    {{ dados.titulo }} · DATASUS
{% endblock %}

{% block header %}
    <header class="topbar topbar--standard">

        <button class="hamburger" id="menuToggle" aria-controls="sidebar" aria-expanded="false" aria-label="Abrir menu">
            <span></span><span></span><span></span>
        </button>

        <a class="marca" href="{{ url_for('home') }}">
    
            <span class="marca-title">Análise de dados<br class="marca-break">do DATASUS</span>
            <span class="marca-divider" aria-hidden="true"></span>
            <span class="marca-subtitle">{{ dados.subtitulo }}</span>
        </a>
        <a class="btn btn--cta" href="{{ url_for('destaque') }}"> Acesse algo
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <path d="M12 4v12m0 0l-4-4m4 4l4-4M5 20h14"/>
            </svg>
        </a>
    </header>
{% endblock %}

{% block content %}
    <section class="page-pad content-section">
        <p class="eyebrow">{{ dados.titulo }}</p>
        
        <div class="content-card">
            <p>{{ dados.texto }}</p>
        </div>
    </section>
{% endblock %}
